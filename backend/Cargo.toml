[package]
name = "backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wirepulse server: streams Hubble flows and Cilium state to the WASM UI"

[[bin]]
name = "wirepulse"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
serde.workspace = true
serde_json.workspace = true

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["earliest"] }
kube = { version = "5", features = ["runtime"] }
prost = "0.14"
prost-types = "0.14"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
