[workspace]
resolver = "2"
members = ["common", "backend", "frontend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Small WASM bundle for the frontend.
[profile.release.package.frontend]
opt-level = "z"
