<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The WirePulse mark (frontend/assets/logo-mark.svg) on a dark tile, for
       the README: it reads the same on GitHub's light and dark themes. -->
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18203a" />
      <stop offset="100%" stop-color="#090c16" />
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#BD00FF" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#BD00FF" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BD00FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#tile)" stroke="url(#edge)" stroke-width="3" />

  <g transform="translate(128 128) scale(0.76)">
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="url(#cyberGradient)" stroke-width="2" opacity="0.3" />
    <g filter="url(#neonGlow)">
      <path d="M-86.6,-50 L-45,-25 L-45,25 L-86.6,50" fill="none" stroke="url(#cyberGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
      <path d="M86.6,-50 L45,-25 L45,25 L86.6,50" fill="none" stroke="url(#cyberGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
      <line x1="0" y1="-100" x2="0" y2="-60" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" opacity="0.8" />
      <line x1="0" y1="100" x2="0" y2="60" stroke="#BD00FF" stroke-width="5" stroke-linecap="round" opacity="0.8" />
      <path d="M-110,0 L-60,0 L-35,-55 L5,75 L35,-35 L60,0 L110,0" fill="none" stroke="url(#pulseGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-86.6" cy="-50" r="7" fill="#00E5FF" />
      <circle cx="-86.6" cy="50" r="7" fill="#BD00FF" />
      <circle cx="86.6" cy="-50" r="7" fill="#00E5FF" />
      <circle cx="86.6" cy="50" r="7" fill="#BD00FF" />
      <circle cx="0" cy="-100" r="7" fill="#00E5FF" />
      <circle cx="0" cy="100" r="7" fill="#BD00FF" />
    </g>
  </g>
</svg>
