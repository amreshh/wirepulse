# Dependabot version updates. Read from and opened against the default
# branch (main); the ci workflow checks and builds them there. Sync dev with
# main after merging one.
#
# "Dependabot security updates" is also on in the repo settings: when a
# dependency gets a vulnerability with a fix, a PR opens right away, without
# the cooldown below, also against main.
version: 2
updates:
  # New releases wait a week before they're proposed, so a compromised one
  # is usually pulled before it reaches this repo. Security fixes don't wait:
  # they come from the security updates above.
  - package-ecosystem: cargo
    directory: /            # workspace root: common, backend, frontend + Cargo.lock
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Workflow actions are pinned to commits; this updates the commit and the
  # version comment next to it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The Dockerfile's base images (the Rust builder and the distroless
  # runtime), pinned by digest: new Rust versions and rebuilt images with
  # security fixes. No cooldown: those fixes shouldn't wait.
  - package-ecosystem: docker # zizmor: ignore[dependabot-cooldown]
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
