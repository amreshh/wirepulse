[package]
name = "frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wirepulse UI, compiled to WebAssembly"

[dependencies]
common = { path = "../common" }
serde.workspace = true
serde_json.workspace = true

console_error_panic_hook = "0.1"
gloo-net = { version = "0.8", default-features = false, features = ["http", "json"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
send_wrapper = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Path2d",
    "PointerEvent",
    "Storage",
    "TextMetrics",
    "WebSocket",
    "WheelEvent",
    "Window",
] }
