# wirepulse: read-only Cilium/Hubble UI.
#
#   kubectl apply -f deploy/wirepulse.yaml
#   kubectl -n wirepulse port-forward svc/wirepulse 8080:80
#
# Set the image to wherever you pushed it, and HUBBLE_RELAY_ADDR / the
# kube-system Role below if Cilium lives in another namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: wirepulse
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wirepulse
  namespace: wirepulse
---
# Cluster-wide, read-only: inventory and policies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wirepulse
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
      - ciliumnodeconfigs
    verbs: ["get", "list"]
  # Watched: the API server sends what changes, not every object each time.
  # CiliumNodes list each node's addresses, which name the node behind
  # Hubble's host, remote-node and kube-apiserver.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumendpoints", "ciliumendpointslices", "ciliumnodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wirepulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wirepulse
subjects:
  - kind: ServiceAccount
    name: wirepulse
    namespace: wirepulse
---
# Only the Cilium agent ConfigMap, nothing else in kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wirepulse-cilium-config
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cilium-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wirepulse-cilium-config
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wirepulse-cilium-config
subjects:
  - kind: ServiceAccount
    name: wirepulse
    namespace: wirepulse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wirepulse
  namespace: wirepulse
  labels:
    app.kubernetes.io/name: wirepulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wirepulse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wirepulse
    spec:
      serviceAccountName: wirepulse
      securityContext:
        runAsNonRoot: true
        # The image's nonroot user and group, by number, so the kubelet can
        # check that it isn't root.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wirepulse
          image: wirepulse:0.1.0 # change to your registry
          imagePullPolicy: IfNotPresent
          env:
            - name: HUBBLE_RELAY_ADDR
              value: http://hubble-relay.kube-system.svc.cluster.local:80
            - name: CILIUM_NAMESPACE
              value: kube-system
            - name: RUST_LOG
              value: info,tower_http=warn,kube=warn
            # Behind an Ingress, list the host name(s) it serves; other names
            # are refused (port-forward needs nothing). See README "Access".
            # - name: WIREPULSE_ALLOWED_HOSTS
            #   value: wirepulse.example.com
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: wirepulse
  namespace: wirepulse
spec:
  selector:
    app.kubernetes.io/name: wirepulse
  ports:
    - name: http
      port: 80
      targetPort: http
